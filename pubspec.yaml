name: krishna_mis
description: "Krishna Imperial MIS - hospitality management and profitability system"
# Private application. Never published to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Encrypted local database (docs/ARCHITECTURE.md §8.1, docs/DECISIONS.md D-029).
# package:sqlite3 3.x selects its native SQLite build through Dart build hooks.
# "sqlite3mc" is the SQLite3MultipleCiphers build, which provides AES-256 encryption
# (including a SQLCipher-compatible cipher) uniformly on Android and Windows without
# linking OpenSSL. Changing this line changes the on-disk cipher — do not edit casually.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & routing
  flutter_riverpod: 3.4.2
  go_router: ^17.5.0

  # Local persistence
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Platform-secure key storage: Android Keystore / Windows DPAPI
  flutter_secure_storage: 9.2.4

  # Backend SDK. Only ever configured with the project URL and the publishable key —
  # a privileged credential must never reach a client binary (D-022, D-044).
  supabase_flutter: ^2.8.0

  # Named only so `bootstrap()` can accept an acceptance-time transport. Nothing in the
  # application makes HTTP calls of its own — every request goes through the Supabase
  # client (see `lib/app/bootstrap.dart`).
  http: ^1.2.0

  # Attachment staging: SHA-256 of the staged bytes, and JPEG re-encoding to bring a
  # phone photo of a bill down to the approved size while keeping it legible. Both are
  # pure Dart, so neither adds a platform plugin to a two-target build.
  crypto: ^3.0.3
  image: ^4.2.0

  # Charts. Presentation only: it is handed values `domain/finance` already computed and
  # renders them (D-257, D-268). Pinned exactly rather than carets, because a chart
  # package's rendering is what several acceptance assertions read — an unreviewed minor
  # bump is a silent change to what a manager sees. Verified against Flutter 3.44.9 /
  # Dart 3.12.2; 1.2.0 itself requires Flutter >=3.27.4, sdk >=3.6.2. It brings `equatable`
  # transitively and nothing else. There is no second charting package in this project.
  fl_chart: 1.2.0

  # Export, PDF and printing (Phase 7, D-298). Pinned exactly: a renderer's output is what
  # the export parity tests read, so an unreviewed bump is a silent change to a document.
  #  - pdf: the PDF document model and layout, pure Dart (Apache-2.0).
  #  - printing: the native Windows print dialog and the Android share sheet (Apache-2.0).
  #    Its Windows build downloads a PDFium binary (PDFIUM_VERSION 5200) at BUILD time;
  #    nothing is fetched at run time. Its Google Fonts helper must never be used (D-295).
  #  - archive: the ZIP container of the internal XLSX writer. Already present
  #    transitively through `image`; promoted to direct at the version pub resolved.
  # Rejected: `excel` (needs archive 3.x) and `share_plus` (needs win32 6.x) — D-298.
  pdf: 3.13.1
  printing: 5.15.1
  archive: 4.2.0

  # Domain support
  uuid: ^4.6.0 # UUID v7, client-generated, time-ordered (D-008)
  timezone: ^0.11.1 # IANA zones for DST-safe business-date derivation (D-019)
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  # Windows DPAPI for the session file, kept apart from the key store (D-246). Both are
  # already in the tree through flutter_secure_storage_windows; pinned to the locked minor.
  win32: ^5.15.0
  ffi: ^2.2.0
  collection: ^1.19.1
  meta: ^1.18.0
  sqlite3: ^3.5.2
  file_selector: ^1.1.0
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+21
  image_picker_platform_interface: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Noto Sans, bundled for the exported PDFs (Phase 7, D-295): Regular and Bold only, with
  # the SIL Open Font License it is distributed under. Read at export time from the bundle;
  # nothing is ever fetched from the network.
  assets:
    - assets/fonts/noto_sans/NotoSans-Regular.ttf
    - assets/fonts/noto_sans/NotoSans-Bold.ttf
    - assets/fonts/noto_sans/OFL.txt
